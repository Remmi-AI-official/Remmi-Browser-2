name: Remmi Browser - Release CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release entry?'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Custom release tag name (leave blank if triggered by git tag)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.REMMI_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || 'vaultkey' }}
          KEY_PASSWORD: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing release keystore Base64 secret! Please set REMMI_RELEASE_KEYSTORE_B64 (or KEYSTORE_BASE64) in GitHub Secrets." >&2
            exit 1
          fi

          echo "Decoding project release keystore from GitHub Secrets..."
          python3 -c "import os, base64, re; raw = os.environ.get('KEYSTORE_BASE64', ''); cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw); cleaned += '=' * ((4 - len(cleaned) % 4) % 4); open('release-keystore.jks', 'wb').write(base64.b64decode(cleaned))"
          test -s release-keystore.jks
          keytool -list -keystore release-keystore.jks -storepass "$STORE_PASSWORD" > /dev/null || {
            echo "::error::Keystore is invalid or corrupt. Check your GitHub Secret value!" >&2
            exit 1
          }

          echo "KEYSTORE_PATH=${{ github.workspace }}/release-keystore.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Validate Release Signing Configuration
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias verified."

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Run Release Lint
        run: |
          ./gradlew lintRelease

      - name: Build Release APKs & Bundle (AAB)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4g"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_dist
          cp -v app/build/outputs/apk/release/*.apk release_dist/ 2>/dev/null || true
          cp -v app/build/outputs/bundle/release/*.aab release_dist/ 2>/dev/null || true
          echo "=== Built Release Files ==="
          ls -lh release_dist/

      - name: Verify Release Signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          for apk in release_dist/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          for aab in release_dist/*.aab; do
            jarsigner -verify -strict "$aab" >/dev/null
          done
          echo "All release artifacts have valid signatures."

      - name: Generate Release Checksums
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum release_dist/*.apk release_dist/*.aab | tee release_dist/SHA256SUMS.txt
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Owner:|SHA256:" | tee release_dist/SIGNING_CERTIFICATE.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: remmi-release-apks
          path: release_dist/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: remmi-release-bundle
          path: |
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
            release_dist/SIGNING_CERTIFICATE.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "Remmi Browser ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_dist/*.apk
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
            release_dist/SIGNING_CERTIFICATE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
