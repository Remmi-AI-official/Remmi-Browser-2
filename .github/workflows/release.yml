name: Remmi Browser - Release CI/CD

on:
  push:
    branches:
      - main
      - master
      - 'release*'
      - 'dev*'
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release entry?'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Custom release tag name (leave blank if triggered by git tag)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.REMMI_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::CRITICAL RELEASE FAILURE: REMMI_RELEASE_KEYSTORE_B64 secret is not configured. Release signing requires a dedicated valid signing keystore secret."
            exit 1
          fi

          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::CRITICAL RELEASE FAILURE: Release keystore credentials (STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be provided in GitHub Secrets."
            exit 1
          fi

          KEYSTORE_FILE="${{ github.workspace }}/release-keystore.jks"
          rm -f "$KEYSTORE_FILE"

          python3 -c "import os, base64, re; raw = os.environ.get('KEYSTORE_BASE64', ''); cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw); cleaned += '=' * ((4 - len(cleaned) % 4) % 4); open('$KEYSTORE_FILE', 'wb').write(base64.b64decode(cleaned))"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::CRITICAL RELEASE FAILURE: Failed to decode release keystore from secret."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::CRITICAL RELEASE FAILURE: Failed to unlock release keystore with alias '$KEY_ALIAS'."
            exit 1
          fi

          echo "Release keystore validated successfully."
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Validate Release Signing Configuration
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias verified."

      - name: Build Release APKs & Bundle (AAB)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4g"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -x test -x lint -x lintRelease --no-daemon --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_dist
          cp -v app/build/outputs/apk/release/*.apk release_dist/ 2>/dev/null || true
          cp -v app/build/outputs/bundle/release/*.aab release_dist/ 2>/dev/null || true
          echo "=== Built Release Files ==="
          ls -lh release_dist/

      - name: Verify Release Signatures
        run: |
          set -uo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            for apk in release_dist/*.apk; do
              if [ -f "$apk" ]; then
                echo "Verifying $apk with apksigner..."
                "$APKSIGNER" verify --verbose "$apk" || true
              fi
            done
          fi
          for aab in release_dist/*.aab; do
            if [ -f "$aab" ]; then
              echo "Verifying $aab with jarsigner..."
              jarsigner -verify "$aab" || true
            fi
          done
          echo "All release artifacts verification completed."

      - name: Generate Release Checksums
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum release_dist/*.apk release_dist/*.aab | tee release_dist/SHA256SUMS.txt
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Owner:|SHA256:" | tee release_dist/SIGNING_CERTIFICATE.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: remmi-release-apks
          path: release_dist/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: remmi-release-bundle
          path: |
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
            release_dist/SIGNING_CERTIFICATE.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "Remmi Browser ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_dist/*.apk
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
            release_dist/SIGNING_CERTIFICATE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
