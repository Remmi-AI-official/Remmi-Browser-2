name: Remmi Browser - Release CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release entry?'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Custom release tag name (leave blank if triggered by git tag)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REMMI_RELEASE_KEYSTORE_B64 || secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REMMI_RELEASE_STORE_PASSWORD || secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.REMMI_RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ secrets.REMMI_RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing required release signing secrets! Configure REMMI_RELEASE_KEYSTORE_B64, REMMI_RELEASE_STORE_PASSWORD, REMMI_RELEASE_KEY_ALIAS, REMMI_RELEASE_KEY_PASSWORD in GitHub Secrets. Release signing does NOT allow unauthenticated or fallback keystores."
            exit 1
          fi

          KEYSTORE_FILE="${{ runner.temp }}/release-keystore.jks"
          echo "Decoding release keystore from GitHub Secrets..."
          rm -f "$KEYSTORE_FILE"
          python3 -c "import os, base64, re; raw = os.environ.get('KEYSTORE_BASE64', ''); cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw); cleaned += '=' * ((4 - len(cleaned) % 4) % 4); open('$KEYSTORE_FILE', 'wb').write(base64.b64decode(cleaned))"

          test -s "$KEYSTORE_FILE" || { echo "::error::Decoded keystore file is empty or missing!"; exit 1; }
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Successfully validated release keystore and alias from secrets."

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: Validate Release Signing Configuration
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias verified."

      - name: Run Release Unit Tests & Lint
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4g"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintRelease --no-daemon --stacktrace

      - name: Build Release APKs & Bundle (AAB)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Xmx4g"
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Organize Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p release_dist
          cp -v app/build/outputs/apk/release/*.apk release_dist/
          cp -v app/build/outputs/bundle/release/*.aab release_dist/

          # Verify APK and AAB exist and are non-empty
          test -n "$(ls -A release_dist/*.apk 2>/dev/null)" || { echo "::error::No release APK found in release_dist!"; exit 1; }
          test -n "$(ls -A release_dist/*.aab 2>/dev/null)" || { echo "::error::No release AAB found in release_dist!"; exit 1; }
          for f in release_dist/*.apk release_dist/*.aab; do
            test -s "$f" || { echo "::error::Release artifact $f is empty!"; exit 1; }
          done

          echo "=== Built Release Files ==="
          ls -lh release_dist/

      - name: Verify Release Signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          for apk in release_dist/*.apk; do
            if [ -f "$apk" ]; then
              echo "Verifying $apk with apksigner..."
              "$APKSIGNER" verify --verbose --print-certs "$apk"
            fi
          done

          for aab in release_dist/*.aab; do
            if [ -f "$aab" ]; then
              echo "Verifying $aab with jarsigner..."
              jarsigner -verify -verbose -certs "$aab"
            fi
          done
          echo "All release artifacts verified and confirmed properly signed."

      - name: Validate Release Artifact Metadata
        run: |
          set -euo pipefail
          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)
          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            for apk in release_dist/*.apk; do
              if [ -f "$apk" ]; then
                echo "Validating metadata for $apk..."
                "$AAPT2" dump badging "$apk" > "${apk}_badging.txt"
                grep -q "package: name='com.remmi.browser'" "${apk}_badging.txt" || { echo "::error::Package name is not com.remmi.browser in $apk"; exit 1; }
                grep -q "sdkVersion:'26'" "${apk}_badging.txt" || { echo "::error::Unexpected minSdk in $apk (expected 26)"; exit 1; }
                grep -q "targetSdkVersion:'36'" "${apk}_badging.txt" || { echo "::error::Unexpected targetSdk in $apk (expected 36)"; exit 1; }
                if grep -q "application-debuggable" "${apk}_badging.txt"; then
                  echo "::error::$apk contains application-debuggable! Release builds must NOT be debuggable."
                  exit 1
                fi
                rm -f "${apk}_badging.txt"
              fi
            done
            echo "Release metadata validation passed: com.remmi.browser, minSdk 26, targetSdk 36, non-debuggable."
          fi

      - name: Generate Release Checksums
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum release_dist/*.apk release_dist/*.aab | tee release_dist/SHA256SUMS.txt
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Owner:|SHA256:" | tee release_dist/SIGNING_CERTIFICATE.txt

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: remmi-release-apks
          path: release_dist/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: remmi-release-bundle
          path: |
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
            release_dist/SIGNING_CERTIFICATE.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "Remmi Browser ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_dist/*.apk
            release_dist/*.aab
            release_dist/SHA256SUMS.txt
            release_dist/SIGNING_CERTIFICATE.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
