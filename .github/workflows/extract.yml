name: Extract Zip to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-detect and extract zip file
        run: |
          # Workspace me kisi bhi .zip file ko search karega
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Error: Repository me koi bhi .zip file nahi mili!"
            echo "Current files in repo:"
            ls -la
            exit 1
          fi

          echo "Extracting $ZIP_FILE to root..."
          unzip -o "$ZIP_FILE" -d .

      - name: Verify extracted files
        run: ls -la
